<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">Stoski Films</title>
  <desc id="desc">Logo Stoski Films com monograma SF dourado e película cinematográfica.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c7"/>
      <stop offset=".22" stop-color="#f1c980"/>
      <stop offset=".48" stop-color="#c78a35"/>
      <stop offset=".7" stop-color="#f5d89d"/>
      <stop offset="1" stop-color="#8d5b22"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b77a31"/>
      <stop offset=".48" stop-color="#f2cf8b"/>
      <stop offset="1" stop-color="#9b6428"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#f7f4ef"/>
      <stop offset="1" stop-color="#c8c5c0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#f2cc87" flood-opacity=".22"/>
    </filter>
  </defs>

  <g transform="translate(6 5)" filter="url(#shadow)">
    <text x="5" y="118" font-family="Georgia,'Times New Roman',serif" font-size="132" font-style="italic" font-weight="400" fill="url(#gold)">S</text>
    <text x="75" y="112" font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="400" fill="url(#gold)">F</text>
    <path d="M20 99 C42 79 73 85 86 100 C98 114 119 118 147 121" fill="none" stroke="url(#goldSoft)" stroke-width="8" stroke-linecap="round"/>
    <path d="M21 99 C42 82 72 88 84 101 C97 114 119 117 146 120" fill="none" stroke="#17120d" stroke-width="3.2" stroke-dasharray="4.5 5.8" stroke-linecap="round" opacity=".9"/>
  </g>

  <text x="172" y="83" fill="url(#white)" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="400" letter-spacing="13" textLength="522" lengthAdjust="spacingAndGlyphs">STOSKI</text>
  <path d="M176 117 H314" stroke="url(#goldSoft)" stroke-width="1.8" opacity=".92"/>
  <text x="334" y="126" fill="url(#goldSoft)" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" letter-spacing="11" textLength="169" lengthAdjust="spacingAndGlyphs">FILMS</text>
  <path d="M523 117 H694" stroke="url(#goldSoft)" stroke-width="1.8" opacity=".92"/>
</svg>