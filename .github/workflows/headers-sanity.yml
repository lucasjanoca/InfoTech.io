name: Response headers sanity check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headers-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate response headers policy
        run: python3 scripts/headers_sanity.py
