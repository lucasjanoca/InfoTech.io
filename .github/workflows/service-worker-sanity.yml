name: Service Worker cache boundary check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  service-worker-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public cache boundaries
        run: python3 scripts/service_worker_sanity.py

      - name: Setup Node.js for Service Worker runtime checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Exercise real Service Worker cache and OAuth boundaries
        run: node --test tests/service-worker-runtime.test.cjs
