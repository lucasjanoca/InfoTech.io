name: Manifest identity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PWA installed identity
        run: python3 scripts/manifest_identity_sanity.py

      - name: Verify PWA shortcut icons
        run: python3 scripts/pwa_shortcut_icon_sanity.py

      - name: Verify PWA shortcut targets
        run: python3 scripts/pwa_shortcut_target_sanity.py

      - name: Verify PWA shortcut metadata
        run: python3 scripts/pwa_shortcut_metadata_sanity.py

      - name: Verify PWA categories
        run: python3 scripts/pwa_categories_sanity.py

      - name: Verify io local loopback boundary
        run: python3 scripts/io_local_loopback_sanity.py
