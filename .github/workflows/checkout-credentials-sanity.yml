name: Checkout credentials sanity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checkout-credentials-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout credentials are never persisted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          failures = []
          checkout_re = re.compile(r'^\s*uses:\s*actions/checkout@[0-9a-fA-F]{40}(?:\s*#.*)?$')
          with_re = re.compile(r'^\s*with:\s*$')
          persist_false_re = re.compile(r'^\s*persist-credentials:\s*false\s*$')

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()

              for index, line in enumerate(lines):
                  if 'uses: actions/checkout@' not in line:
                      continue

                  if not checkout_re.match(line):
                      failures.append(
                          f'{path}:{index + 1}: actions/checkout deve permanecer fixado por SHA completo'
                      )
                      continue

                  indent = len(line) - len(line.lstrip())
                  found_with = False
                  found_persist_false = False

                  for candidate in lines[index + 1:]:
                      if not candidate.strip():
                          continue

                      candidate_indent = len(candidate) - len(candidate.lstrip())
                      if candidate_indent <= indent:
                          break

                      if with_re.match(candidate):
                          found_with = True
                      elif found_with and persist_false_re.match(candidate):
                          found_persist_false = True

                  if not found_persist_false:
                      failures.append(
                          f'{path}:{index + 1}: checkout deve declarar persist-credentials: false'
                      )

          if failures:
              print('Falha na proteção de credenciais do checkout:', file=sys.stderr)
              for failure in failures:
                  print(f'- {failure}', file=sys.stderr)
              raise SystemExit(1)

          print('Todos os checkouts usam SHA imutável e persist-credentials: false.')
          PY
